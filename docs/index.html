<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f0e">
<title>Micología</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <h1 id="ttl">Mapa</h1>
  <button id="chip" class="chip live" hidden></button>
  <button id="syncbtn" class="syncbtn" aria-label="Sincronizar"></button>
</header>
<main>
  <section id="v-mapa" class="view mapview">
    <div id="map"></div>
    <div id="gps" class="gps">GPS…</div>
    <div class="maptools">
      <button id="locate" class="tool" aria-label="Centrar en mi posición">◎</button>
      <button id="layerbtn" class="tool" aria-label="Cambiar mapa">▦</button>
      <button id="spotbtn" class="tool" aria-label="Nuevo spot">⚑</button>
      <button id="filterbtn" class="tool" aria-label="Filtrar hallazgos">⛛</button>
    </div>
    <button id="fab" class="fab">Marcar aquí</button>
  </section>
  <section id="v-salidas" class="view" hidden></section>
  <section id="v-salida" class="view" hidden></section>
  <section id="v-setas" class="view" hidden></section>
  <section id="v-mes" class="view" hidden></section>
  <section id="v-ajustes" class="view" hidden></section>
</main>
<nav class="nav">
  <a href="#mapa" data-tab="mapa"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Mapa</a>
  <a href="#salidas" data-tab="salidas"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h5a3.5 3.5 0 0 0 0-7h-2a3.5 3.5 0 0 1 0-7h5"/></svg>Salidas</a>
  <a href="#setas" data-tab="setas"><svg viewBox="0 0 24 24"><path d="M12 4C7 4 3.500 7.300 3.500 11.500c0 .5.4.8.8.8h15.400c.4 0 .8-.3.8-.8C20.500 7.300 17 4 12 4z"/><path d="M9.500 12.500v4.500c0 1.700 1 3 2.500 3s2.500-1.300 2.500-3v-4.500"/></svg>Setas</a>
  <a href="#mes" data-tab="mes"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/><circle cx="12" cy="15" r="1.600"/></svg>Este mes</a>
  <a href="#ajustes" data-tab="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.500 12H21M5.600 5.600l1.800 1.800M16.600 16.600l1.800 1.800M5.600 18.400l1.800-1.800M16.600 7.400l1.800-1.800"/></svg>Ajustes</a>
</nav>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status"></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
